<script>
// Decide before first paint whether the 3D scene is coming, so nothing flashes
// on screen first. main.js removes this class once the scene is up.
(function () {
  try {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var c = document.createElement('canvas');
    var gl = !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
    if (gl && !reduce) {
      window.__boot = performance.now();
      document.documentElement.classList.add('pending3d');
      // safety: if the 3D bundle never arrives, reveal the page
      window.setTimeout(function () {
        document.documentElement.classList.remove('pending3d');
      }, 5000);
    }
  } catch (e) { /* no WebGL: just show the page */ }
})();
</script>
