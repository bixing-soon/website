<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="千早愛音">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbd6e1"/>
      <stop offset="100%" stop-color="#f4a6c0"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfd9e2"/>
      <stop offset="100%" stop-color="#9fb0bd"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1b181f"/>

  <!-- hair (back) -->
  <path d="M32 9 C16 9 11 20 11 33 C11 48 17 58 32 58 C47 58 53 48 53 33 C53 20 48 9 32 9 Z" fill="url(#hair)"/>

  <!-- face -->
  <ellipse cx="32" cy="33" rx="11.5" ry="12.5" fill="#fce6da"/>

  <!-- bangs with a centre part -->
  <path d="M13 32 C13 16 22 9 32 9 C42 9 51 16 51 32 C47 25 43 23 38 19 C36 25 34 27 32 25 C30 27 28 25 26 19 C21 23 17 25 13 32 Z" fill="url(#hair)"/>

  <!-- school uniform: blazer, shirt, tie -->
  <path d="M7 63 C9 53 18 49 26 48 L32 56 L38 48 C46 49 55 53 57 63 Z" fill="#cfcac4"/>
  <path d="M24 48 L32 58 L40 48 L36 46 L32 51 L28 46 Z" fill="#ffffff"/>
  <path d="M29 51 L35 51 L32 63 Z" fill="#3f6b3a"/>
  <path d="M30.5 57 L33.5 57 M31 60 L33 60" stroke="#d9c26a" stroke-width="1" stroke-linecap="round"/>
  <path d="M29 49 L35 49 L32 52 Z" fill="#355c30"/>

  <!-- long side strands over the uniform -->
  <path d="M12 31 C9 40 9 50 12 58 C14 60 17 59 17 56 C15 48 15 40 16 32 Z" fill="url(#hair)"/>
  <path d="M52 31 C55 40 55 50 52 58 C50 60 47 59 47 56 C49 48 49 40 48 32 Z" fill="url(#hair)"/>

  <!-- eyebrows -->
  <path d="M21 29 Q25 27.5 29 29" stroke="#d98aa2" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M35 29 Q39 27.5 43 29" stroke="#d98aa2" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="25" cy="36.5" rx="3.2" ry="3.8" fill="url(#eye)"/>
  <ellipse cx="39" cy="36.5" rx="3.2" ry="3.8" fill="url(#eye)"/>
  <circle cx="24" cy="35" r="1" fill="#ffffff"/>
  <circle cx="38" cy="35" r="1" fill="#ffffff"/>

  <!-- round glasses -->
  <circle cx="25" cy="36" r="6" fill="none" stroke="#2f2b2e" stroke-width="2"/>
  <circle cx="39" cy="36" r="6" fill="none" stroke="#2f2b2e" stroke-width="2"/>
  <path d="M31 34.5 Q32 33.5 33 34.5" stroke="#2f2b2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M19 34 L14 33 M45 34 L50 33" stroke="#2f2b2e" stroke-width="1.6" stroke-linecap="round"/>

  <!-- blush, nose, open mouth -->
  <ellipse cx="22.5" cy="44.5" rx="2.4" ry="1.5" fill="#f7a9bf" opacity="0.75"/>
  <ellipse cx="41.5" cy="44.5" rx="2.4" ry="1.5" fill="#f7a9bf" opacity="0.75"/>
  <circle cx="32" cy="40" r="0.7" fill="#e8b9a8"/>
  <ellipse cx="32" cy="43.5" rx="2.6" ry="2.2" fill="#a64b56"/>
  <ellipse cx="32" cy="44.2" rx="1.7" ry="1.3" fill="#e08b8f"/>
</svg>
