<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>睦 SHRINE</title>
<meta name="theme-color" content="#0b080c">
<meta name="color-scheme" content="dark">
<script>
(function () {
  try {
    if (window.location.hash === '#happi-mu' ||
        window.sessionStorage.getItem('mutou:happi-mu') === '1') {
      document.documentElement.classList.add('is-cleared');
    }
  } catch (e) { /* storage can be unavailable */ }
})();
</script>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="key-defs" aria-hidden="true" focusable="false">
  <symbol id="key-icon" viewBox="0 0 32 92">
    <path fill="currentColor" fill-rule="evenodd" d="M16 4a11 11 0 0 1 0 22 11 11 0 0 1 0-22Zm0 5.5a5.5 5.5 0 0 0 0 11 5.5 5.5 0 0 0 0-11ZM12.5 26h7v57h-7ZM19.5 70h8v6h-8ZM19.5 82h6v6h-6Z"></path>
    <circle cx="16" cy="4" r="2.4" fill="currentColor"></circle>
    <circle cx="5" cy="15" r="2.4" fill="currentColor"></circle>
    <circle cx="27" cy="15" r="2.4" fill="currentColor"></circle>
  </symbol>
</svg>

<main class="shrine" id="main">
  <img class="mutsumi-bg" id="mutsumi-bg" src="/images/mutsumi-grim.webp" alt="">

  <a class="close is-hidden" href="/#curse-of-mu" aria-label="Close and return to the last tower">&times;</a>

  <h1 class="shrine-title">睦 SHRINE</h1>

  <div class="glitch" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="keys" id="keys" aria-label="Key game"></div>
  <p class="key-hint is-hidden" id="key-hint">FIND THE PINK KEY</p>
</main>

<div class="jumpscare" id="jumpscare" aria-hidden="true">
  <img src="/images/mutsumi-smile.webp" alt="">
</div>

<script src="keys.js"></script>
</body>
</html>
