on:
  push:
    branches:
      - main

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VAR_cf_api_token: ${{ secrets.CF_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ secrets.ZONE_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # R2_BUCKET_NAME secret

jobs:
  setup-terraform:
     runs-on: ubuntu-latest
     steps:
       - name: checkout
         uses: actions/checkout@v6
       - name: setup terraform
         uses: hashicorp/setup-terraform@v4
       - name: initialize terraform
         run: |
          terraform init -input=false \
            -backend-config="endpoints={s3=\"https://${{ secrets.ACCOUNT_ID }}.r2.cloudflarestorage.com\"}" \
            -backend-config="bucket=${{ secrets.R2_BUCKET_NAME }}"
         working-directory: ./infra
       - name: validate
         run: terraform validate
         working-directory: ./infra
       - name: plan
         run: terraform plan -input=false -out=tfplan
         working-directory: ./infra
       - name: apply
         run: terraform apply -input=false tfplan
         working-directory: ./infra
